<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Management - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.10);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 25px;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 28px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            margin-bottom: 17px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 9px;
            padding: 13px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .7;
            cursor: wait;
        }

        .message {
            display: none;
            margin-bottom: 16px;
            padding: 11px;
            border-radius: 8px;
            font-size: 14px;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .info {
            display: block;
            background: #dbeafe;
            color: #1e40af;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h1>WiFi Management</h1>
    <div class="subtitle">Coworking Space Management System</div>

    <div id="message" class="message"></div>

    <form id="loginForm">
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Masukkan username"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginButton">
            Login
        </button>
    </form>

    <div class="footer">
        Sistem Manajemen Akses Wi-Fi
    </div>
</div>

<script>
const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (!username || !password) {
        showMessage("Username dan password wajib diisi.", "error");
        return;
    }

    button.disabled = true;
    button.textContent = "Login...";

    showMessage("Memproses login...", "info");

    try {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok || data.status !== "OK") {
            throw new Error(data.message || "Username atau password salah.");
        }

        const role = String(data.role || "").toUpperCase();

        if (role === "ADMIN") {
            window.location.href = "/admin/";
        } else if (role === "MEMBER") {
            window.location.href = "/member/";
        } else if (role === "TECHNICIAN") {
            window.location.href = "/technician/";
        } else {
            throw new Error("Role pengguna tidak dikenali.");
        }

    } catch (error) {
        showMessage(error.message || "Login gagal.", "error");
        button.disabled = false;
        button.textContent = "Login";
    }
});
</script>

</body>
</html>
