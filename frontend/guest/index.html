<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guest WiFi - KP WiFi Management</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  color:#1f2937
}
.card{
  width:100%;
  max-width:500px;
  background:#fff;
  border-radius:18px;
  padding:30px;
  box-shadow:0 12px 35px rgba(0,0,0,.10)
}
.logo{
  display:block;
  max-width:170px;
  max-height:70px;
  object-fit:contain;
  margin:0 auto 20px
}
h1{
  margin:0 0 8px;
  text-align:center;
  font-size:25px
}
.subtitle{
  text-align:center;
  color:#6b7280;
  margin-bottom:22px
}
.info{
  background:#eef6ff;
  border:1px solid #cfe5ff;
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:20px;
  font-size:14px;
  line-height:1.5
}
label{
  display:block;
  margin:15px 0 7px;
  font-weight:600
}
input,textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:12px 13px;
  font-size:15px;
  outline:none
}
input:focus,textarea:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.10)
}
textarea{
  min-height:110px;
  resize:vertical
}
button{
  width:100%;
  margin-top:22px;
  border:0;
  border-radius:10px;
  padding:13px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  background:#2563eb;
  color:#fff
}
button:disabled{
  opacity:.6;
  cursor:not-allowed
}
#message{
  display:none;
  margin-top:18px;
  padding:13px;
  border-radius:10px;
  line-height:1.5
}
.success{
  display:block!important;
  background:#ecfdf5;
  border:1px solid #a7f3d0;
  color:#065f46
}
.error{
  display:block!important;
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#991b1b
}
.small{
  text-align:center;
  margin-top:18px;
  font-size:12px;
  color:#9ca3af
}
</style>
</head>

<body>
<div class="card">

<img
  class="logo"
  src="/assets/smtel-logo.png"
  alt="SMTEL"
  onerror="this.style.display='none'"
>

<h1>Guest WiFi</h1>

<div class="subtitle">
  Silakan isi data sebelum menggunakan akses Guest.
</div>

<div class="info">
  👋 Akses Guest tidak memerlukan username dan password portal.
  Silakan isi data berikut untuk pencatatan akses WiFi.
</div>

<form id="guestForm">

<label for="name">Atas Nama</label>
<input
  id="name"
  name="name"
  type="text"
  placeholder="Nama lengkap"
  autocomplete="name"
  required
>

<label for="company">PT / Instansi</label>
<input
  id="company"
  name="company"
  type="text"
  placeholder="Nama PT / Instansi"
  required
>

<label for="purpose">Keperluan</label>
<textarea
  id="purpose"
  name="purpose"
  placeholder="Contoh: Meeting, kunjungan, maintenance, dll."
  required
></textarea>

<button id="submitBtn" type="submit">
  Mulai Akses Wi-Fi
</button>

</form>

<div id="message"></div>

<div class="small">
  KP WiFi Management
</div>

</div>

<script>
const form = document.getElementById("guestForm");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

function showMessage(text, type){
  message.textContent = text;
  message.className = type;
}

form.addEventListener("submit", async function(e){
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const company = document.getElementById("company").value.trim();
  const purpose = document.getElementById("purpose").value.trim();

  if(!name || !company || !purpose){
    showMessage("Semua data wajib diisi.", "error");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Memproses...";

  try{
    const response = await fetch("/api/guest/session", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        name:name,
        company:company,
        purpose:purpose
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "Gagal memulai akses Guest.");
    }

    form.style.display = "none";

    let endTime = "-";

    if(data.guest && data.guest.access_end){
      endTime = new Date(
        data.guest.access_end
      ).toLocaleString("id-ID");
    }

    showMessage(
      "Data berhasil dicatat. Akses Guest aktif sampai " + endTime + ".",
      "success"
    );

  }catch(err){
    showMessage(
      err.message || "Terjadi kesalahan.",
      "error"
    );

    submitBtn.disabled = false;
    submitBtn.textContent = "Mulai Akses Wi-Fi";
  }
});
</script>

</body>
</html>
