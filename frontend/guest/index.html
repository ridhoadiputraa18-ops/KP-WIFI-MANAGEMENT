<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guest Wi-Fi</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#0f172a,#1e3a8a);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 color:#fff
}
.card{
 width:100%;
 max-width:430px;
 background:#fff;
 color:#172033;
 border-radius:22px;
 padding:28px;
 box-shadow:0 20px 50px #0006
}
.logo{
 width:64px;
 height:64px;
 border-radius:18px;
 background:#2563eb;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:30px;
 margin-bottom:18px
}
h1{margin:0 0 8px;font-size:28px}
.desc{color:#64748b;margin-bottom:24px;line-height:1.5}
label{
 display:block;
 font-weight:bold;
 margin:14px 0 7px
}
input{
 width:100%;
 padding:14px;
 border:1px solid #cbd5e1;
 border-radius:12px;
 font-size:16px;
 outline:none
}
input:focus{border-color:#2563eb}
button{
 width:100%;
 border:0;
 padding:15px;
 margin-top:20px;
 border-radius:12px;
 background:#2563eb;
 color:white;
 font-size:16px;
 font-weight:bold;
 cursor:pointer
}
button:disabled{opacity:.6}
.info{
 background:#eff6ff;
 border-radius:12px;
 padding:14px;
 margin-top:18px;
 font-size:14px;
 color:#1e40af
}
.status{
 display:none;
 margin-top:18px;
 padding:14px;
 border-radius:12px;
 background:#ecfdf5;
 color:#166534
}
.error{
 display:none;
 margin-top:18px;
 padding:14px;
 border-radius:12px;
 background:#fef2f2;
 color:#991b1b
}
.back{
 display:block;
 text-align:center;
 margin-top:18px;
 color:#2563eb;
 text-decoration:none
}
.small{
 text-align:center;
 color:#64748b;
 font-size:12px;
 margin-top:20px
}
</style>
</head>

<body>
<div class="card">
  <div class="logo">📶</div>

  <h1>Guest Wi-Fi</h1>
  <div class="desc">
    Selamat datang. Silakan login menggunakan akun Guest Wi-Fi yang telah diberikan.
  </div>

  <div class="info">
    🔐 Akses Wi-Fi sementara untuk pengunjung.
  </div>

  <form id="guestForm">
    <label for="username">Username</label>
    <input
      id="username"
      name="username"
      type="text"
      placeholder="Masukkan username"
      maxlength="100"
      required
      autocomplete="username"
    >

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      placeholder="Masukkan password"
      maxlength="200"
      required
      autocomplete="current-password"
    >

    <button id="submitBtn" type="submit">
      Login & Mulai Akses
    </button>
  </form>

  <div id="status" class="status"></div>
  <div id="error" class="error"></div>

  <a class="back" href="/">← Kembali</a>

  <div class="small">
    Coworking Space Wi-Fi Management
  </div>
</div>

<script>
const form = document.getElementById("guestForm");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const button = document.getElementById("submitBtn");
const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");

function showError(message){
  errorBox.textContent = message;
  errorBox.style.display = "block";
  statusBox.style.display = "none";
}

function showStatus(message){
  statusBox.textContent = message;
  statusBox.style.display = "block";
  errorBox.style.display = "none";
}

async function loadConfig(){
  try{
    const res = await fetch("/api/guest/config");

    if(!res.ok) return;

    const data = await res.json();

    if(data && data.name){
      document.title = data.name + " - Guest Wi-Fi";
    }
  }catch(e){
    console.log("config belum tersedia");
  }
}

async function apiRequest(url, options = {}){
  const res = await fetch(url, {
    credentials: "same-origin",
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  const text = await res.text();

  let data = {};

  try{
    data = JSON.parse(text);
  }catch(e){}

  if(!res.ok){
    throw new Error(
      data.message ||
      data.error ||
      "Permintaan gagal."
    );
  }

  return data;
}

form.addEventListener("submit", async function(e){
  e.preventDefault();

  const username = usernameInput.value.trim();
  const password = passwordInput.value;

  if(!username){
    showError("Username wajib diisi.");
    usernameInput.focus();
    return;
  }

  if(!password){
    showError("Password wajib diisi.");
    passwordInput.focus();
    return;
  }

  button.disabled = true;
  button.textContent = "Login...";

  try{
    // ========================================================
    // STEP 1: LOGIN GUEST ACCOUNT
    // ========================================================
    const loginData = await apiRequest("/api/guest/login", {
      method: "POST",
      body: JSON.stringify({
        username: username,
        password: password
      })
    });

    // ========================================================
    // STEP 2: BUAT GUEST SESSION
    // ========================================================
    button.textContent = "Memulai akses...";

    const sessionData = await apiRequest("/api/guest/session", {
      method: "POST",
      body: JSON.stringify({})
    });

    const guestName =
      loginData.name ||
      sessionData.name ||
      username;

    showStatus(
      "Login berhasil. Selamat datang, " +
      guestName +
      ". Sesi Guest Wi-Fi telah dimulai."
    );

    form.style.display = "none";

  }catch(err){
    showError(
      err.message ||
      "Login Guest Wi-Fi gagal."
    );

    passwordInput.value = "";
    passwordInput.focus();

  }finally{
    button.disabled = false;
    button.textContent = "Login & Mulai Akses";
  }
});

loadConfig();
</script>
</body>
</html>
