name: Generate Account Hashes

on:
  workflow_dispatch:

jobs:
  hash:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Generate hashes
        working-directory: tools/hashgen
        run: go run .

      - name: Generate hash file
        working-directory: tools/hashgen
        run: go run . > hashes.txt

      - name: Upload hashes
        uses: actions/upload-artifact@v4
        with:
          name: account-hashes
          path: tools/hashgen/hashes.txt
