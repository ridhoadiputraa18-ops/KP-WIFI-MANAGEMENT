name: Generate Account Hashes

on:
  workflow_dispatch:

jobs:
  hash:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Generate hashes
        working-directory: backend
        run: go run ./cmd/hashgen > hashes.txt

      - name: Show generated hash names
        working-directory: backend
        run: sed 's/=.*$/=***HIDDEN***/' hashes.txt

      - name: Upload hashes
        uses: actions/upload-artifact@v4
        with:
          name: account-hashes
          path: backend/hashes.txt
