name: Build Android Backend

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Build Android ARM64
        working-directory: backend
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o wifi-management-android-arm64 .
          chmod +x wifi-management-android-arm64

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: wifi-management-android-arm64
          path: backend/wifi-management-android-arm64
